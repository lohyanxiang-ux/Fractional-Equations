<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Boss Battle: Tactical Legend</title>
    <style>
        :root {
            --primary: #4ecca3;
            --danger: #ff416c;
            --recovery: #00d2ff;
            --bg-strike: #1a1a2e;
            --bg-heal: #0f3d30;
            --panel: #16213e;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-strike); 
            color: white; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw;
            display: flex; 
            transition: background 0.4s ease;
        }

        /* Heal Mode Override */
        body.heal-active { background: var(--bg-heal); }
        body.heal-active .col { border-color: rgba(0, 210, 255, 0.3); }

        /* --- 3-COLUMN LAYOUT STRUCTURE --- */
        #game-layout {
            display: flex;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .col {
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* Column 1: Boss & Stats */
        #left-col {
            flex: 3.5;
            background: var(--panel);
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            justify-content: flex-start;
            gap: 12px;
            text-align: center;
        }

        /* Column 2: Canvas Scratchpad */
        #mid-col {
            flex: 4;
            background: #0f172a;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Column 3: Virtual Numpad & Actions */
        #right-col {
            flex: 3;
            background: var(--panel);
            justify-content: space-between;
            overflow-y: auto;
            text-align: center;
        }

        /* HP Bars */
        .hp-bar-outer { position: relative; width: 100%; height: 26px; background: #333; border-radius: 13px; border: 2px solid #fff; overflow: hidden; margin: 4px 0; }
        .hp-fill { width: 100%; height: 100%; transition: width 0.4s ease-out; }
        #boss-fill { background: linear-gradient(90deg, var(--danger), #ff4b2b); }
        #player-fill { background: linear-gradient(90deg, var(--recovery), #3a7bd5); }
        
        .hp-label-centered {
            position: absolute; width: 100%; top: 0; left: 0; height: 26px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: bold; text-shadow: 1px 1px 3px #000;
            color: white; pointer-events: none; z-index: 5;
        }

        #boss-name { font-size: 1.5rem; color: var(--danger); font-weight: bold; margin: 0; text-shadow: 0 0 10px rgba(255, 65, 108, 0.3); }
        #level-tag { font-size: 0.85rem; color: var(--primary); font-weight: bold; margin-bottom: 2px; }

        /* Fraction Styling */
        #equation-display { 
            font-size: 1.8rem; 
            min-height: 100px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: rgba(255,255,255,0.05); 
            border-radius: 8px; 
            padding: 10px;
            transition: 0.3s;
        }
        
        .frac { display: inline-block; vertical-align: middle; text-align: center; margin: 0 6px; }
        .num { display: block; border-bottom: 3px solid white; padding: 2px 5px; color: white; }
        .den { display: block; padding: 2px 5px; color: white; }
        .op { margin: 0 6px; display: inline-block; vertical-align: middle; font-weight: bold; color: white; }
        
        /* Input Display */
        .input-area { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0; }
        input { 
            font-size: 1.8rem; padding: 8px; width: 130px; text-align: center; border-radius: 8px; 
            border: 2px solid var(--primary); background: #0b1e36; color: #fff; outline: none; 
            box-shadow: 0 0 10px rgba(78, 204, 163, 0.1);
        }

        #timer-box { font-size: 0.9rem; color: #f1c40f; font-weight: bold; }
        #combo-box { font-size: 1.1rem; color: #e67e22; font-weight: bold; min-height: 22px; }
        #feedback { font-weight: bold; height: 50px; font-size: 0.9rem; margin: 4px 0; display: flex; align-items: center; justify-content: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Action Buttons */
        .action-area { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
        .main-btn { 
            font-size: 1.2rem; padding: 12px 0; width: 100%; cursor: pointer; 
            border: none; font-weight: bold; border-radius: 10px; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .main-btn:active { transform: scale(0.98); }
        #attack-btn { background: var(--primary); color: #1a1a2e; box-shadow: 0 4px 0 #3aa885; }
        #heal-btn { background: var(--recovery); color: white; display: none; box-shadow: 0 4px 0 #009acb; }

        /* Skill Selector */
        .final-boss-ui { display: none; flex-wrap: wrap; gap: 4px; justify-content: center; background: rgba(0,0,0,0.2); padding: 6px; border-radius: 8px; }
        .lvl-btn { font-size: 0.75rem; padding: 6px; background: #8e44ad; color: white; border: none; border-radius: 4px; flex: 1; min-width: 50px; cursor: pointer; font-weight: bold; opacity: 0.7; }
        .lvl-btn.active-skill { border: 2px solid #f1c40f; background: #6c3483; opacity: 1; transform: scale(1.05); }

        /* Annotation Workspace */
        #annotation-toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tool-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            user-select: none;
        }
        .tool-btn.active { background: var(--primary); color: #1a1a2e; }
        #drawingCanvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

        /* Virtual Keypad */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: auto;
        }
        .key {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 14px 0;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key:active { background: rgba(255, 255, 255, 0.25); }
        .key.back-key { background: #c0392b; }

        /* Overlays */
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; }
        .overlay p { font-style: italic; color: #ccc; margin-bottom: 20px; line-height: 1.6; max-width: 450px;}
    </style>
</head>
<body>

    <div id="game-layout">
        <!-- COLUMN 1: Boss Stats & Equation Display -->
        <div class="col" id="left-col">
            <div class="boss-section">
                <div id="boss-name">Fraction Golem</div>
                <div id="level-tag">STAGE 1</div>
                <div class="hp-bar-outer">
                    <div id="boss-fill" class="hp-fill"></div>
                    <div id="boss-hp-text" class="hp-label-centered">BOSS HP: 100 / 100</div>
                </div>
            </div>

            <div id="final-boss-controls" class="final-boss-ui">
                <button class="lvl-btn" onclick="setFinalLvl(1)">LVL 1</button>
                <button class="lvl-btn" onclick="setFinalLvl(2)">LVL 2</button>
                <button class="lvl-btn" onclick="setFinalLvl(3)">LVL 3</button>
                <button class="lvl-btn" onclick="setFinalLvl(4)">LVL 4</button>
                <button class="lvl-btn" onclick="setFinalLvl(5)">LVL 5</button>
                <button class="lvl-btn" onclick="setFinalLvl(6)">LVL 6</button>
            </div>

            <div id="combo-box"></div>
            <div id="timer-box">Critical Window: 20s</div>
            
            <div id="equation-display"></div>

            <div class="player-section">
                <div class="hp-bar-outer">
                    <div id="player-fill" class="hp-fill"></div>
                    <div id="player-hp-text" class="hp-label-centered">PLAYER HP: 100 / 100</div>
                </div>
            </div>
        </div>

        <!-- COLUMN 2: Canvas Scratchpad Workspace -->
        <div class="col" id="mid-col">
            <div id="annotation-toolbar">
                <div class="tool-btn" id="tool-cursor" onclick="setDrawMode('none')">👆</div>
                <div class="tool-btn active" id="tool-pen" onclick="setDrawMode('pen')">✏️</div>
                <div class="tool-btn" id="tool-eraser" onclick="setDrawMode('eraser')">🧽</div>
                <div class="tool-btn" id="tool-clear" onclick="clearCanvas()">🗑️</div>
            </div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <!-- COLUMN 3: Inputs, Virtual Keypad & Actions -->
        <div class="col" id="right-col">
            <div>
                <div class="input-area">
                    <span id="var-label" style="font-size: 1.8rem; font-weight:bold;">x</span> 
                    <span style="font-size: 1.8rem; margin: 0 5px;">=</span> 
                    <!-- inputmode="none" and readonly prevents iPad soft keyboard -->
                    <input type="text" id="answer-input" inputmode="none" readonly autocomplete="off">
                </div>

                <div class="action-area">
                    <button id="attack-btn" class="main-btn" onclick="handleAction('strike')">STRIKE</button>
                    <button id="heal-btn" class="main-btn" onclick="handleAction('heal')">HEAL</button>
                </div>

                <div id="feedback"></div>
            </div>

            <!-- Virtual Numpad -->
            <div class="keypad-grid">
                <div class="key" onclick="pressKey('7')">7</div>
                <div class="key" onclick="pressKey('8')">8</div>
                <div class="key" onclick="pressKey('9')">9</div>
                <div class="key" onclick="pressKey('4')">4</div>
                <div class="key" onclick="pressKey('5')">5</div>
                <div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('1')">1</div>
                <div class="key" onclick="pressKey('2')">2</div>
                <div class="key" onclick="pressKey('3')">3</div>
                <div class="key" onclick="pressKey('-')">-</div>
                <div class="key" onclick="pressKey('0')">0</div>
                <div class="key back-key" onclick="pressKey('back')">⌫</div>
            </div>
        </div>
    </div>

    <!-- Overlays -->
    <div id="transition-overlay" class="overlay">
        <h2 id="trans-title" style="color: var(--primary);">Victory!</h2>
        <p id="trans-flavor"></p>
        <p id="trans-msg"></p>
        <button onclick="closeTransition()" style="padding: 12px 24px; cursor: pointer; background: var(--primary); border: none; font-weight: bold; border-radius: 5px;">Continue</button>
    </div>

    <div id="game-over-overlay" class="overlay">
        <h2 style="color: var(--danger);">DEFEAT</h2>
        <div id="defeat-summary"></div>
        <button onclick="location.reload()" style="margin-top:20px; padding: 12px 24px; cursor: pointer;">Revive</button>
    </div>

    <div id="victory-screen" class="overlay">
        <h1 style="color: #f1c40f;">GAME CLEARED!</h1>
        <div id="victory-summary" style="line-height: 1.8; margin-bottom: 20px;"></div>
        <button onclick="location.reload()" style="padding: 12px 24px; cursor: pointer; background: var(--primary); border: none; font-weight: bold; border-radius: 5px;">Play Again</button>
    </div>

    <script>
        // Game Logic State
        let level = 1, bossHp = 100, playerHp = 100, solution = 0;
        let combo = 0, timeLeft = 20, timerInterval, regenInterval;
        let isFinalBoss = false, isHealMode = false;
        let finalSelectedLvl = 1;
        let totalCorrect = 0, totalCrits = 0;
        let wrongStreak = 0;

        const bosses = [
            { name: "Fraction Golem", flavor: "It crumbles into dust. You have shattered the rocky exterior to reveal the simple integers within." },
            { name: "Variable Viper", flavor: "You untangled its logic. The serpent's coils loosen as you solve for the unknown, ending its reign of confusion." },
            { name: "Coefficient King", flavor: "The crown falls. His multipliers have been divided, and his power reduced to one. Long live the logic!" },
            { name: "Denominator Demon", flavor: "Banished to the abyss! You found common ground where there was none and balanced the chaos." },
            { name: "Common Denominator", flavor: "Divided and conquered. The great unifier has been simplified to its lowest terms." },
            { name: "LCD Overlord", flavor: "Its complexity was no match for you. The least common multiple has been found, and order is restored." },
            { name: "ALGEBRA LORD", flavor: "The Equation Realm is saved! You have balanced the ultimate equation and proven yourself a legend." }
        ];

        const healFailMessages = [
            "You drank the wrong potion!", "The potion bottle was empty!",
            "You spilled the elixir!", "The cork was stuck!", "It was just grape juice. No healing."
        ];

        const normalAttacks = [
            "Threw a fireball!", "Slashed with your sword!", "Fired an arcane missile!",
            "Launched a lightning bolt!", "Struck with a warhammer!", "Blasted with energy!"
        ];

        const criticalAttacks = [
            "CRITICAL HIT! Struck a weak point!", "MAXIMUM POWER! A devastating blow!",
            "PERFECT AIM! Pierced the armor!", "ELEMENTAL BURST! Massive damage!", "EXECUTION! The boss reels!"
        ];

        // --- CANVAS SCRATCHPAD JS ---
        let canvas, ctx, isDrawing = false, drawMode = 'pen';

        function initCanvas() {
            canvas = document.getElementById('drawingCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e.touches[0]); });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
            canvas.addEventListener('touchend', stopDraw);
        }

        function resizeCanvas() {
            const container = document.getElementById('mid-col');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function setDrawMode(mode) {
            drawMode = mode;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'pen') document.getElementById('tool-pen').classList.add('active');
            if (mode === 'eraser') document.getElementById('tool-eraser').classList.add('active');
            if (mode === 'none') document.getElementById('tool-cursor').classList.add('active');
        }

        function startDraw(e) {
            if (drawMode === 'none') return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing || drawMode === 'none') return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = drawMode === 'eraser' ? 24 : 3;
            ctx.lineCap = 'round';
            if (drawMode === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = '#4ecca3';
            }
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function stopDraw() { isDrawing = false; }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // --- VIRTUAL KEYPAD INPUT ---
        function pressKey(keyVal) {
            const input = document.getElementById('answer-input');
            if (keyVal === 'back') {
                input.value = input.value.slice(0, -1);
            } else if (keyVal === '-') {
                if (input.value.startsWith('-')) {
                    input.value = input.value.substring(1);
                } else {
                    input.value = '-' + input.value;
                }
            } else {
                input.value += keyVal;
            }
        }

        // --- GAME MECHANICS ---
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 20;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-box').innerText = timeLeft > 0 ? `Critical Window: ${timeLeft}s` : "Normal Power";
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        regenInterval = setInterval(() => {
            const maxB = isFinalBoss ? 200 : 100;
            if (bossHp > 0 && bossHp < maxB) {
                bossHp = Math.min(maxB, bossHp + 1);
                updateBars();
            }
        }, 2000);

        function rInt(min, max) {
            let n = Math.floor(Math.random() * (max - min + 1)) + min;
            return n === 0 ? rInt(min, max) : n;
        }

        function cleanTerm(coeff, v) {
            if (coeff === 1) return v;
            if (coeff === -1) return `-${v}`;
            return `${coeff}${v}`;
        }

        function formatOp(val) { return val >= 0 ? `+ ${val}` : `- ${Math.abs(val)}`; }
        function fraction(num, den) { return `<div class="frac"><span class="num">${num}</span><span class="den">${den}</span></div>`; }

        function getEqText(targetLvl) {
            const vars = ['x', 'y', 'w', 'k'];
            const curVar = vars[Math.floor(Math.random() * vars.length)];
            document.getElementById('var-label').innerText = curVar;
            solution = rInt(-8, 8); if (solution === 0) solution = 4;
            let a, b, den1, den2, res;

            switch(targetLvl) {
                case 1:
                    den1 = rInt(2, 8); res = solution; solution = den1 * res; 
                    return `${fraction(curVar, den1)} <span class="op">=</span> ${res}`;
                case 2:
                    den1 = rInt(2, 6);
                    do { a = rInt(2, 5); } while (a === den1 || a % den1 === 0 || den1 % a === 0);
                    while((a * solution) % den1 !== 0) solution++;
                    res = (a * solution) / den1; 
                    return `${fraction(cleanTerm(a, curVar), den1)} <span class="op">=</span> ${res}`;
                case 3:
                    a = rInt(1, 2); if(Math.random() > 0.5) a = -a;
                    den1 = rInt(2, 5); res = rInt(-4, 4);
                    b = (res * den1) - (a * solution);
                    if (b === 0) { b = den1; res++; }
                    return `${fraction(cleanTerm(a, curVar) + " " + formatOp(b), den1)} <span class="op">=</span> ${res}`;
                case 4:
                    b = rInt(-6, 6); let denom = solution + b;
                    while(denom === 0) { solution++; denom = solution + b; }
                    res = rInt(1, 4); if(Math.random()>0.5) res = -res;
                    let num = res * denom;
                    return `${fraction(num, curVar + " " + formatOp(b))} <span class="op">=</span> ${res}`;
                case 5:
                    den1 = rInt(2, 6); a = rInt(1, 4); b = rInt(1, 4); 
                    let op5 = Math.random()>0.5 ? 1 : -1;
                    while (a + (op5 * b) === 0) { b = rInt(1, 4); }
                    res = ((a + (op5*b)) * solution) / den1;
                    while(!Number.isInteger(res)) { solution++; res = ((a + (op5*b)) * solution) / den1; }
                    let opSign = op5 === 1 ? "+" : "-";
                    return `${fraction(cleanTerm(a, curVar), den1)} <span class="op">${opSign}</span> ${fraction(cleanTerm(b, curVar), den1)} <span class="op">=</span> ${res}`;
                case 6:
                    den1 = rInt(2, 3); den2 = rInt(4, 5); b = rInt(-4, 4); let op6 = Math.random()>0.5 ? 1 : -1;
                    res = (solution/den1) + (op6*(solution+b)/den2);
                    let att = 0; while(!Number.isInteger(res) && att < 30) { solution++; res = (solution/den1) + (op6*(solution+b)/den2); att++; }
                    let opSign6 = op6 === 1 ? "+" : "-";
                    return `${fraction(curVar, den1)} <span class="op">${opSign6}</span> ${fraction(curVar + " " + formatOp(b), den2)} <span class="op">=</span> ${res}`;
                default: return `${fraction(curVar, 2)} <span class="op">=</span> 4`; 
            }
        }

        function getBaseDamage(lvl) {
            if (lvl <= 2) return 6;
            if (lvl <= 4) return 12;
            return 18;
        }

        function generate() {
            let activeLvl = level;
            const body = document.body;

            if (isHealMode) {
                activeLvl = level > 1 ? rInt(1, level - 1) : 1;
                body.classList.add('heal-active');
                document.getElementById('level-tag').innerText = `HEAL MODE (Lvl ${activeLvl})`;
                document.getElementById('attack-btn').style.display = 'none';
                document.getElementById('heal-btn').style.display = 'block';
            } else {
                if (isFinalBoss) activeLvl = finalSelectedLvl;
                body.classList.remove('heal-active');
                document.getElementById('level-tag').innerText = isFinalBoss ? `FINAL STAGE` : `STAGE ${level}`;
                document.getElementById('attack-btn').style.display = 'block';
                document.getElementById('heal-btn').style.display = playerHp < 100 ? 'block' : 'none';
            }
            
            document.getElementById('equation-display').innerHTML = getEqText(activeLvl);
            document.getElementById('boss-name').innerText = isFinalBoss ? bosses[6].name : bosses[level-1].name;
            startTimer();
        }

        function handleAction(type) {
            if (type === 'heal' && !isHealMode) {
                isHealMode = true;
                generate();
                return;
            }

            const val = parseInt(document.getElementById('answer-input').value);
            const feedback = document.getElementById('feedback');
            if (isNaN(val)) return;

            if (val === solution) {
                totalCorrect++;
                wrongStreak = 0;
                
                if (isHealMode) {
                    playerHp = Math.min(100, playerHp + 10);
                    feedback.innerHTML = `<span style="color:var(--recovery)">RECOVERY SUCCESS! +10 HP</span>`;
                    isHealMode = false;
                } else {
                    combo++;
                    let effectiveLvl = isFinalBoss ? finalSelectedLvl : level;
                    let baseDmg = getBaseDamage(effectiveLvl);
                    
                    let totalDmg = baseDmg;
                    if (combo === 2) totalDmg *= 2;
                    else if (combo >= 3) totalDmg *= 3;
                    
                    let isCrit = false;
                    if (timeLeft > 0) {
                        totalDmg = Math.floor(totalDmg * 1.5);
                        isCrit = true;
                        totalCrits++;
                    }
                    
                    bossHp -= totalDmg;
                    
                    let flavorText = isCrit 
                        ? criticalAttacks[Math.floor(Math.random() * criticalAttacks.length)]
                        : normalAttacks[Math.floor(Math.random() * normalAttacks.length)];
                    
                    feedback.innerHTML = `<span style="color:var(--primary)">${flavorText}<br>Dealt ${totalDmg} DMG!</span>`;
                }
                
                updateBars();
                if(bossHp > 0) generate();

            } else {
                combo = 0;
                
                if (isHealMode) {
                    const msg = healFailMessages[Math.floor(Math.random() * healFailMessages.length)];
                    feedback.innerHTML = `<span style="color:var(--danger)">${msg}</span>`;
                    isHealMode = false;
                    generate();
                } else {
                    wrongStreak++;
                    if (wrongStreak >= 2) {
                        playerHp -= 10;
                        feedback.innerHTML = `<span style="color:var(--danger)">You missed! Boss deals 10 damage!</span>`;
                        wrongStreak = 0;
                        generate(); 
                    } else {
                        feedback.innerHTML = `<span style="color:var(--danger)">Missed! Watch out!</span>`;
                    }
                }
                updateBars();
            }

            document.getElementById('answer-input').value = "";
        }

        function updateBars() {
            if (bossHp <= 0) { 
                bossHp = 0; 
                isFinalBoss && level >= 7 ? showVictory() : showTransition();
                return;
            }
            if (playerHp <= 0) { playerHp = 0; showGameOver(); return; }
            
            const maxB = isFinalBoss ? 200 : 100;
            document.getElementById('boss-fill').style.width = (bossHp / maxB * 100) + "%";
            document.getElementById('boss-hp-text').innerText = `BOSS HP: ${bossHp} / ${maxB}`;
            
            document.getElementById('player-fill').style.width = playerHp + "%";
            document.getElementById('player-hp-text').innerText = `PLAYER HP: ${playerHp} / 100`;
            
            document.getElementById('combo-box').innerText = combo > 1 ? `${combo}x COMBO!` : "";
            
            if (!isHealMode) {
                document.getElementById('heal-btn').style.display = playerHp < 100 ? "block" : "none";
            }
        }

        function setFinalLvl(l) { 
            finalSelectedLvl = l; 
            document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active-skill'));
            document.querySelectorAll('.lvl-btn')[l-1].classList.add('active-skill');
            generate(); 
        }

        function showTransition() {
            document.getElementById('transition-overlay').style.display = 'flex';
            document.getElementById('trans-flavor').innerText = bosses[level-1].flavor;
            document.getElementById('trans-msg').innerText = level < 7 ? `Next: ${bosses[level].name}` : "FINAL CHALLENGE!";
        }

        function closeTransition() {
            document.getElementById('transition-overlay').style.display = 'none';
            if (level < 6) { 
                level++; bossHp = 100; 
                generate();
            }
            else if (level == 6) { 
                level++; bossHp = 200; isFinalBoss = true; 
                document.getElementById('final-boss-controls').style.display = 'flex'; 
                setFinalLvl(1);
            }
            else {
                showVictory();
            }
            isHealMode = false;
            updateBars();
        }

        function showGameOver() {
            document.getElementById('game-over-overlay').style.display = 'flex';
            document.getElementById('defeat-summary').innerHTML = `Defeated at Stage ${level}<br>Correct Answers: ${totalCorrect}`;
        }

        function showVictory() {
            document.getElementById('victory-screen').style.display = 'flex';
            document.getElementById('victory-summary').innerHTML = `
                Total Correct: ${totalCorrect}<br>
                Critical Hits: ${totalCrits}<br>
                Status: LEGENDARY
            `;
        }

        window.onload = () => {
            initCanvas();
            generate();
        };
    </script>
</body>
</html>
